name: Compilar PS3 pkg

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Conseguir rsxutil desde los samples de PSL1GHT
        run: |
          if [ ! -f source/rsxutil.c ]; then
            git clone --depth 1 https://github.com/ps3dev/PSL1GHT.git /tmp/psl1ght
            RSX=$(find /tmp/psl1ght/samples -name rsxutil.c | head -1)
            echo "Usando: $RSX"
            cp "$RSX" source/
            cp "$(dirname "$RSX")/rsxutil.h" source/
          fi

      - name: Compilar y empaquetar dentro de Docker
        run: |
          docker run --rm -v "$PWD:/build" -w /build ghcr.io/altps3/ps3dev:latest sh -c 'export PS3DEV=${PS3DEV:-/usr/local/ps3dev}; export PSL1GHT=${PSL1GHT:-$PS3DEV}; export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin; make pkg'

      - name: Guardar el resultado para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: mini-contra-pkg
          path: |
            *.pkg
            *.self
          if-no-files-found: error
